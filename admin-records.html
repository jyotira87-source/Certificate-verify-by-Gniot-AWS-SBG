<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Records &mdash; Advance Certificate Verification</title>
    <link rel="stylesheet" href="frontend/css/design-tokens.css" />
    <link rel="stylesheet" href="frontend/css/base.css" />
    <link rel="stylesheet" href="frontend/css/responsive.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0e17" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner container">
        <div class="brand">Certificate Records</div>
        <div class="nav-links">
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-audit.html">Audit Logs</a>
          <button type="button" class="btn btn-outline btn-sm" id="logout-btn">Logout</button>
        </div>
      </div>
    </nav>

    <main>
      <div class="container" style="padding: var(--space-8) 0 var(--space-16);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
          <div>
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-weight-bold); color: var(--text-primary);">Certificate Records</h2>
            <p style="font-size: var(--text-sm); color: var(--text-secondary);">Search and manage all registered certificates.</p>
          </div>
          <a href="register.html" class="btn btn-primary">Register New</a>
        </div>

        <!-- Search and filters -->
        <div class="card" style="margin-bottom: var(--space-8);">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); padding: var(--space-6);">
            <div class="form-group">
              <label class="form-label" for="search-query">Search</label>
              <input type="text" id="search-query" class="form-input" placeholder="Certificate ID, holder, title&hellip;" />
            </div>
            <div class="form-group">
              <label class="form-label" for="filter-status">Status</label>
              <select id="filter-status" class="form-input">
                <option value="">All statuses</option>
                <option value="verified">Verified</option>
                <option value="expired">Expired</option>
                <option value="revoked">Revoked</option>
                <option value="pending_review">Pending Review</option>
              </select>
            </div>
            <div class="form-group" style="display: flex; align-items: bottom;">
              <button type="button" class="btn btn-primary" id="search-btn">Search</button>
              <button type="button" class="btn btn-outline" id="clear-btn">Clear</button>
            </div>
          </div>
        </div>

        <!-- Results table -->
        <div class="card">
          <div style="overflow-x: auto;">
            <table class="table">
              <thead>
                <tr>
                  <th>Certificate ID</th>
                  <th>Holder Name</th>
                  <th>Title</th>
                  <th>Organization</th>
                  <th>Issue Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="records-table-body">
                <!-- Injected by JS -->
              </tbody>
            </table>
          </div>
          <div id="records-pagination" class="pagination" style="margin-top: var(--space-6);">
            <!-- Injected by JS -->
          </div>
        </div>
      </div>
    </main>

    <footer style="border-top: 1px solid var(--border-color); padding: var(--space-8) 0; margin-top: var(--space-12);">
      <div class="container" style="font-size: var(--text-xs); color: var(--text-muted); text-align: center;">
        <p>&copy; 2026 Advance Certificate Verification.</p>
      </div>
    </footer>

    <div id="toast-container" class="toast-container"></div>
    <div id="confirm-dialog" style="display:none;">
      <div class="dialog-overlay" id="confirm-overlay"></div>
      <div class="dialog">
        <h2 id="confirm-title">Confirm Action</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-outline" id="confirm-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-action">Confirm</button>
        </div>
      </div>
    </div>

    <script type="module" src="frontend/js/config.js"></script>
    <script type="module" src="frontend/js/theme.js"></script>
    <script type="module" src="frontend/js/toast.js"></script>
    <script type="module" src="frontend/js/auth.js"></script>
    <script type="module" src="frontend/js/api-client.js"></script>
    <script type="module" src="frontend/js/pages/admin-records.js"></script>
  </body>
</html>
