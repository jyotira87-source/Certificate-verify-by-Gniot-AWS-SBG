<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Certificate &mdash; Advance Certificate Verification</title>
    <link rel="stylesheet" href="frontend/css/design-tokens.css" />
    <link rel="stylesheet" href="frontend/css/base.css" />
    <link rel="stylesheet" href="frontend/css/responsive.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0e17" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner container">
        <div class="brand">Verify Certificate</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="scan.html">Scan Certificate</a>
          <a href="admin-login.html">Admin Login</a>
        </div>
      </div>
    </nav>

    <main>
      <div class="container" style="padding: var(--space-8) 0 var(--space-16);">
        <a href="index.html" class="btn btn-outline btn-sm" style="margin-bottom: var(--space-6);">&#8592; Back to Home</a>

        <div style="max-width: 560px; margin: 0 auto;">
          <h2 style="font-size: var(--text-2xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-3); color: var(--text-primary);">Verify Certificate</h2>
          <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-8);">
            Enter the certificate ID printed on the certificate to check its
            authenticity against the official registry.
          </p>

          <form id="verify-form" class="card" novalidate>
            <div class="form-group">
              <label class="form-label" for="verify-code">Certificate ID</label>
              <input
                type="text"
                id="verify-code"
                name="code"
                class="form-input"
                placeholder="e.g. GNIOT-AWS-2026-001"
                required
                maxlength="64"
              />
              <p class="form-error" id="verify-error" style="display:none;"></p>
            </div>

            <div style="display: flex; gap: var(--space-3); margin-top: var(--space-6);">
              <button type="submit" class="btn btn-primary btn-lg" id="verify-btn">Verify</button>
              <button type="button" class="btn btn-outline" onclick="window.location.href='scan.html'">Scan instead</button>
            </div>
          </form>

          <div id="verify-loading" style="display:none; margin-top: var(--space-6); text-align: center;">
            <div class="skeleton-text line-short" style="margin: 0 auto; width: 120px;"></div>
            <p style="font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-2);">Verifying certificate&hellip;</p>
          </div>

          <div id="verify-result" style="display:none; margin-top: var(--space-6);"></div>
        </div>
      </div>
    </main>

    <footer style="border-top: 1px solid var(--border-color); padding: var(--space-8) 0; margin-top: var(--space-12);">
      <div class="container" style="display: flex; justify-content: space-between; align-items: center; font-size: var(--text-xs); color: var(--text-muted);">
        <p>&copy; 2026 Advance Certificate Verification.</p>
        <div style="display: flex; gap: var(--space-4);">
          <a href="help.html">Help</a>
          <a href="privacy.html">Privacy</a>
        </div>
      </div>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="frontend/js/config.js"></script>
    <script type="module" src="frontend/js/theme.js"></script>
    <script type="module" src="frontend/js/toast.js"></script>
    <script type="module" src="frontend/js/auth.js"></script>
    <script type="module" src="frontend/js/api-client.js"></script>
    <script type="module" src="frontend/js/pages/verify.js"></script>
  </body>
</html>
