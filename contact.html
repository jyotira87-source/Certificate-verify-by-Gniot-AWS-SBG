<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact &mdash; Advance Certificate Verification</title>
    <link rel="stylesheet" href="frontend/css/design-tokens.css" />
    <link rel="stylesheet" href="frontend/css/base.css" />

  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner container">
        <div class="brand">Contact</div>
        <div class="nav-links"><a href="index.html">Home</a></div>
      </div>
    </nav>
    <main>
      <div class="container" style="padding: var(--space-8) 0 var(--space-16); max-width: 600px; margin: 0 auto;">
        <h2 style="font-size: var(--text-2xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-6); color: var(--text-primary);">Contact Us</h2>
        <p style="color: var(--text-secondary); line-height: var(--leading-relaxed); margin-bottom: var(--space-8);">
          For questions about certificate verification, administrator access, or technical support, please reach out.
        </p>
        <div class="card" style="padding: var(--space-8);">
          <h3 style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--text-primary); margin-bottom: var(--space-4);">General Inquiries</h3>
          <p style="color: var(--text-secondary); margin-bottom: var(--space-4);">Email: support@example.com</p>
          <h3 style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--text-primary); margin-bottom: var(--space-3); margin-top: var(--space-6);">Administrator Support</h3>
          <p style="color: var(--text-secondary); margin: 0;">Email: admin@example.com</p>
        </div>
      </div>
    </main>
    <footer style="border-top: 1px solid var(--border-color); padding: var(--space-8) 0; margin-top: var(--space-12); text-align: center; font-size: var(--text-xs); color: var(--text-muted);">
      <p>&copy; 2026 Advance Certificate Verification.</p>
    </footer>
  </body>
</html>
