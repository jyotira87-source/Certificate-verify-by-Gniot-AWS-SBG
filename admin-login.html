<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login &mdash; Advance Certificate Verification</title>
    <link rel="stylesheet" href="frontend/css/design-tokens.css" />
    <link rel="stylesheet" href="frontend/css/base.css" />
    <link rel="stylesheet" href="frontend/css/responsive.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0e17" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner container">
        <div class="brand">Admin Login</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="verify.html">Verify</a>
        </div>
      </div>
    </nav>

    <main>
      <div class="container" style="padding: var(--space-8) 0 var(--space-16);">
        <div style="max-width: 480px; margin: 0 auto;">
          <div class="card">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-6); color: var(--text-primary);">Administrator Login</h2>
            <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-8);">
              Sign in to manage certificates, view audit logs, and export records.
            </p>

            <form id="login-form" novalidate>
              <div class="form-group">
                <label class="form-label" for="admin-username">Username</label>
                <input type="text" id="admin-username" name="username" class="form-input" placeholder="admin" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
              </div>

              <div class="form-error" id="login-error" style="display:none;"></div>

              <button type="submit" class="btn btn-primary btn-lg" id="login-btn" style="width: 100%; margin-top: var(--space-6);">Sign In</button>
            </form>

            <p style="font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-6); text-align: center;">
              Default credentials: admin / admin123 (change in production)
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer style="border-top: 1px solid var(--border-color); padding: var(--space-8) 0; margin-top: var(--space-12);">
      <div class="container" style="font-size: var(--text-xs); color: var(--text-muted); text-align: center;">
        <p>&copy; 2026 Advance Certificate Verification.</p>
      </div>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="frontend/js/config.js"></script>
    <script type="module" src="frontend/js/theme.js"></script>
    <script type="module" src="frontend/js/toast.js"></script>
    <script type="module" src="frontend/js/auth.js"></script>
    <script type="module" src="frontend/js/api-client.js"></script>
    <script type="module" src="frontend/js/pages/admin-login.js"></script>
  </body>
</html>
