<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Logs &mdash; Advance Certificate Verification</title>
    <link rel="stylesheet" href="frontend/css/design-tokens.css" />
    <link rel="stylesheet" href="frontend/css/base.css" />
    <link rel="stylesheet" href="frontend/css/responsive.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0e17" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner container">
        <div class="brand">Audit Logs</div>
        <div class="nav-links">
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-records.html">Records</a>
          <button type="button" class="btn btn-outline btn-sm" id="logout-btn">Logout</button>
        </div>
      </div>
    </nav>

    <main>
      <div class="container" style="padding: var(--space-8) 0 var(--space-16);">
        <h2 style="font-size: var(--text-xl); font-weight: var(--font-weight-bold); margin-bottom: var(space-4); color: var(--text-primary);">Audit Logs</h2>
        <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-8);">Immutable record of administrative actions and verification events.</p>

        <div class="card">
          <div style="overflow-x: auto;">
            <table class="table">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Action</th>
                  <th>Actor</th>
                  <th>Target</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="audit-table-body">
                <!-- Injected by JS -->
              </tbody>
            </table>
          </div>
          <div id="audit-pagination" class="pagination" style="margin-top: var(--space-6);">
            <!-- Injected by JS -->
          </div>
        </div>
      </div>
    </main>

    <footer style="border-top: 1px solid var(--border-color); padding: var(--space-8) 0; margin-top: var(--space-12);">
      <div class="container" style="font-size: var(--text-xs); color: var(--text-muted); text-align: center;">
        <p>&copy; 2026 Advance Certificate Verification.</p>
      </div>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="frontend/js/config.js"></script>
    <script type="module" src="frontend/js/theme.js"></script>
    <script type="module" src="frontend/js/toast.js"></script>
    <script type="module" src="frontend/js/auth.js"></script>
    <script type="module" src="frontend/js/api-client.js"></script>
    <script type="module" src="frontend/js/pages/admin-audit.js"></script>
  </body>
</html>
